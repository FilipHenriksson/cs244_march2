<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Scheduler — Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ================================================================
   DESIGN: Industrial control-room aesthetic — dark, dense, precise.
   Monospace dominates. Color is functional, never decorative.
   ================================================================ */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:      #08090c;
  --bg2:     #0f1117;
  --bg3:     #161922;
  --bg4:     #1e222e;
  --surface: #12151e;

  --tx:  #d4d7e0;
  --tx2: #7c8194;
  --tx3: #474d60;

  --accent:    #5b6aff;
  --accent-hi: #7b87ff;
  --accent-bg: rgba(91,106,255,0.07);
  --accent-b:  rgba(91,106,255,0.22);

  --green:    #2dd4a0;
  --green-bg: rgba(45,212,160,0.06);
  --green-b:  rgba(45,212,160,0.18);

  --amber:    #e5a50a;
  --amber-bg: rgba(229,165,10,0.06);
  --amber-b:  rgba(229,165,10,0.15);

  --red:    #ef5f5f;
  --red-bg: rgba(239,95,95,0.06);

  --teal: #22c9b0;

  --border:  rgba(255,255,255,0.04);
  --border2: rgba(255,255,255,0.08);

  --mono: 'JetBrains Mono', monospace;
  --sans: 'IBM Plex Sans', sans-serif;
  --radius: 6px;
}

body {
  background: var(--bg);
  color: var(--tx);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  overflow-x: hidden;
}

/* ---------- Layout ---------- */
.app {
  display: grid;
  grid-template-columns: 380px 1fr;
  grid-template-rows: auto 1fr;
  height: 100vh;
  min-height: 0;
}

.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 0.5px solid var(--border2);
  background: var(--bg2);
}
.topbar h1 {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.03em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
.topbar-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--tx3);
  display: flex;
  gap: 16px;
}
.topbar-meta span { color: var(--tx2); }

.panel-left {
  border-right: 0.5px solid var(--border2);
  overflow-y: auto;
  padding: 14px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.panel-right {
  overflow-y: auto;
  padding: 14px 20px;
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* ---------- Stats row ---------- */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.stat-card {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
}
.stat-label {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--tx3);
  margin-bottom: 2px;
}
.stat-val {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.04em;
}
.stats-subtitle {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--tx3);
  text-align: right;
  margin-top: -6px;
}

/* ---------- Phase tracker ---------- */
.phase-bar {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  gap: 0;
}
.phase-bar-label {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--tx3);
  margin-bottom: 4px;
}
.phase-step {
  display: flex;
  align-items: center;
  gap: 5px;
  flex: 1;
  font-size: 11px;
  font-family: var(--mono);
}
.phase-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  border: 1.5px solid var(--tx3);
  flex-shrink: 0;
}
.phase-dot.done  { background: var(--green); border-color: var(--green); }
.phase-dot.active { background: var(--accent); border-color: var(--accent); animation: pulse 1.5s ease-in-out infinite; }
.phase-name { color: var(--tx3); }
.phase-name.done  { color: var(--tx2); }
.phase-name.active { color: var(--tx); font-weight: 500; }
.phase-count { font-size: 10px; color: var(--tx3); }
.phase-count.active { color: var(--accent-hi); }
.phase-sep { width: 14px; height: 0.5px; background: var(--tx3); opacity: .25; }

/* ---------- Rate limit banner ---------- */
.rate-banner {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  background: var(--amber-bg);
  border: 0.5px solid var(--amber-b);
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--amber);
}
.rate-banner.visible { display: flex; }

/* ---------- Section headers ---------- */
.section-hd {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--tx3);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-hd::after {
  content: '';
  flex: 1;
  height: 0.5px;
  background: var(--border);
}

/* ---------- Queue items ---------- */
#pending-list, #inflight-list { display: flex; flex-direction: column; gap: 3px; }

.q-row {
  display: grid;
  grid-template-columns: 30px 1fr 32px 44px;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 5px;
  transition: border-color 0.2s, background 0.2s;
}
.q-row.mine {
  border-color: var(--accent-b);
  background: var(--accent-bg);
  border-left: 2px solid var(--accent);
}
.q-pos {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  line-height: 1;
}
.q-arrow {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  animation: arrow-fade 2s ease-out forwards;
}
.q-arrow.up { color: var(--green); }
.q-arrow.down { color: var(--red); }
.q-arrow.new-item { color: var(--accent-hi); font-size: 8px; }
@keyframes arrow-fade {
  0% { opacity: 1; }
  60% { opacity: 1; }
  100% { opacity: 0; }
}
.q-info {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.q-name {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.q-session {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  flex-shrink: 0;
}
.q-pri {
  font-family: var(--mono);
  font-size: 11px;
  text-align: right;
}
.q-sid {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  text-align: center;
}
.q-sid.mine-sid { color: var(--accent-hi); font-weight: 600; }
.badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 8px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 3px;
  letter-spacing: 0.03em;
  vertical-align: middle;
}
.badge-you  { background: var(--accent-bg); color: var(--accent-hi); border: 0.5px solid var(--accent-b); }
.badge-rpm  { background: var(--amber-bg); color: var(--amber); }

/* In-flight items */
.if-row {
  display: grid;
  grid-template-columns: 1fr 48px 52px;
  align-items: center;
  gap: 4px;
  padding: 5px 8px;
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: 5px;
}
.if-row.mine { border-color: var(--accent-b); background: var(--accent-bg); border-left: 2px solid var(--accent); }
.if-elapsed {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx2);
  text-align: right;
}
.bar-track { height: 2px; border-radius: 1px; background: var(--bg4); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 1px; background: var(--accent); animation: barloop 2.5s ease-in-out infinite; }
@keyframes barloop { 0%{width:8%} 50%{width:80%} 100%{width:8%} }

/* ---------- Empty state ---------- */
.empty-state {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  padding: 6px 8px;
  font-style: italic;
}

/* ================================================================
   RIGHT PANEL — Chat output
   ================================================================ */
.chat-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 0.5px solid var(--border2);
}
.chat-hd h2 {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
}
.session-tag {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--accent-hi);
  background: var(--accent-bg);
  border: 0.5px solid var(--accent-b);
  padding: 2px 8px;
  border-radius: 4px;
}

/* Messages */
.msg {
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  line-height: 1.6;
}
.msg-user {
  background: var(--accent);
  color: #fff;
  border-bottom-right-radius: 2px;
  max-width: 80%;
  align-self: flex-end;
}
.msg-sys {
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-bottom-left-radius: 2px;
}
.step-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--tx3);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-top: 6px;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.step-num {
  font-family: var(--mono);
  font-size: 9px;
  background: var(--bg4);
  padding: 1px 6px;
  border-radius: 3px;
  color: var(--tx2);
}

/* Analyst cards */
.analyst-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
.ac {
  background: var(--surface);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  min-height: 56px;
  transition: border-color 0.3s, background 0.3s;
}
.ac.done    { border-color: var(--green-b); }
.ac.active  { border-color: var(--accent-b); background: var(--accent-bg); }
.ac.pending { opacity: .35; }
.ac-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.ac-name {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
}
.ac-status {
  font-family: var(--mono);
  font-size: 10px;
}
.ac-status.done   { color: var(--green); }
.ac-status.active { color: var(--accent-hi); }
.ac-status.pending { color: var(--tx3); }
.ac-body {
  font-size: 11px;
  color: var(--tx2);
  line-height: 1.5;
  max-height: 68px;
  overflow: hidden;
  position: relative;
}
.ac-body.has-content::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 20px;
  background: linear-gradient(transparent, var(--surface));
}
.ac.active .ac-body.has-content::after {
  background: linear-gradient(transparent, #131726);
}

/* Ghost steps */
.ghost { opacity: .2; }
.ghost .msg-sys {
  border: 0.5px dashed var(--tx3);
  background: transparent;
  color: var(--tx3);
  font-style: italic;
  font-size: 12px;
  padding: 6px 14px;
}

/* Typing indicator */
.typing { display: inline-flex; gap: 3px; padding: 3px 0; }
.typing i {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--tx3);
  animation: blink 1.4s infinite;
}
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,60%,100%{opacity:.3} 30%{opacity:1} }

/* ---------- Completion banner ---------- */
.completion-banner {
  background: var(--surface);
  border: 0.5px solid var(--green-b);
  border-radius: 8px;
  padding: 20px 24px;
  text-align: center;
  animation: banner-in 0.6s ease-out;
}
@keyframes banner-in {
  0% { opacity: 0; transform: translateY(12px); }
  100% { opacity: 1; transform: translateY(0); }
}
.completion-check {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--green-bg);
  border: 1.5px solid var(--green-b);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: var(--green);
  margin-bottom: 10px;
  animation: check-pop 0.4s ease-out 0.2s both;
}
@keyframes check-pop {
  0% { transform: scale(0.5); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
.completion-title {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--tx);
  margin-bottom: 8px;
}
.completion-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 10px;
}
.completion-stat {
  text-align: center;
}
.completion-stat-val {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.04em;
}
.completion-stat-label {
  font-family: var(--mono);
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--tx3);
  margin-top: 2px;
}

/* Phase bar done state */
.phase-bar.all-done {
  border-color: var(--green-b);
  background: var(--green-bg);
}

/* ---------- Setup overlay ---------- */
.setup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8,9,12,0.92);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.setup-overlay.hidden { display: none; }
.setup-box {
  background: var(--bg3);
  border: 0.5px solid var(--border2);
  border-radius: 10px;
  padding: 28px 32px;
  width: 380px;
}
.setup-box h2 {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 16px;
}
.setup-box label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--tx2);
  display: block;
  margin-bottom: 4px;
  margin-top: 12px;
}
.setup-box input, .setup-box textarea {
  width: 100%;
  background: var(--bg);
  border: 0.5px solid var(--border2);
  border-radius: 5px;
  padding: 8px 10px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--tx);
  outline: none;
}
.setup-box input:focus, .setup-box textarea:focus {
  border-color: var(--accent-b);
}
.setup-box textarea { resize: vertical; min-height: 60px; }
.setup-btn {
  margin-top: 18px;
  width: 100%;
  padding: 10px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 5px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.setup-btn:hover { opacity: 0.85; }
.setup-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ---------- Connection status ---------- */
.conn-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--tx3);
  transition: background 0.3s;
}
.conn-dot.connected { background: var(--green); animation: pulse 2s ease-in-out infinite; }
.conn-dot.error { background: var(--red); }
</style>
</head>
<body>

<!-- Setup overlay -->
<div class="setup-overlay" id="setup">
  <div class="setup-box">
    <h2>Scheduler demo</h2>
    <label>Server URL</label>
    <input type="text" id="cfg-url" value="" placeholder="Leave empty for same origin" />
    <label>API key</label>
    <input type="password" id="cfg-key" value="" />
    <label>Prompt</label>
    <textarea id="cfg-prompt">What are the latest advances in quantum error correction?</textarea>
    <button class="setup-btn" id="cfg-go" onclick="startDemo()">Connect &amp; run</button>
  </div>
</div>

<!-- Main app -->
<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <h1><span class="conn-dot" id="conn-dot"></span> LLM Scheduler — <span id="sched-name">MapReduce</span></h1>
    <div class="topbar-meta">
      <span id="meta-sessions">0 sessions</span>
      <span id="meta-rpm">rpm —</span>
      <span id="meta-tpm">tpm —</span>
    </div>
  </div>

  <!-- Left panel: Queue -->
  <div class="panel-left">
    <div class="stats">
      <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-val" id="stat-pending" style="color:var(--accent-hi)">0</div></div>
      <div class="stat-card"><div class="stat-label">Dispatched</div><div class="stat-val" id="stat-inflight" style="color:var(--green)">0</div></div>
      <div class="stat-card"><div class="stat-label">Done</div><div class="stat-val" id="stat-done">0</div></div>
      <div class="stat-card"><div class="stat-label">Avg lat</div><div class="stat-val" id="stat-lat" style="color:var(--amber)">—</div></div>
    </div>
    <div class="stats-subtitle">All sessions</div>

    <div class="phase-bar-label">Your session <span class="badge badge-you" id="my-session-badge" style="margin-left:4px">—</span></div>
    <div class="phase-bar" id="phase-bar"></div>

    <div class="rate-banner" id="rate-banner">&#9202; Rate limited</div>

    <div class="section-hd">Pending</div>
    <div id="pending-list"><div class="empty-state">No pending calls</div></div>

    <div class="section-hd">Dispatched</div>
    <div id="inflight-list"><div class="empty-state">Nothing dispatched</div></div>
  </div>

  <!-- Right panel: Chat output -->
  <div class="panel-right">
    <div class="chat-hd">
      <h2>Workflow output</h2>
      <div class="session-tag" id="chat-session-tag">—</div>
    </div>
    <div id="chat-body" style="display:flex;flex-direction:column;gap:10px;padding-bottom:20px;"></div>
  </div>

</div>

<script>
// ================================================================
// State
// ================================================================
let BASE_URL = '';
let API_KEY  = '';
let MY_INT_ID = null;
let MY_SESSION_ID = null;

let globalSSE = null;
let sessionSSE = null;

let completedCount = 0;
let latencies = [];

// Phase tracking
const PHASES = ['plan','analysts','synthesize','reviewers','final'];
const PHASE_LABELS = ['Plan','Analysts','Synth','Review','Final'];
const PHASE_TOTALS = { analysts: 5, reviewers: 3 };
let currentPhase = null;
let phaseCounts = { analysts: 0, reviewers: 0 };

// Analyst/reviewer state for chat panel
const ANALYSTS = ['analyst_web_research','analyst_summarizer','analyst_deep_analysis','analyst_historical_context','analyst_statistical'];
const REVIEWERS = ['review_citations','review_style','review_facts'];
let analystResults = {};
let analystStatus = {};

// ================================================================
// Setup
// ================================================================
async function startDemo() {
  BASE_URL = document.getElementById('cfg-url').value.replace(/\/+$/, '');
  API_KEY = document.getElementById('cfg-key').value;
  const prompt = document.getElementById('cfg-prompt').value;

  const btn = document.getElementById('cfg-go');
  btn.disabled = true;
  btn.textContent = 'Connecting...';

  try {
    // Fetch server config
    const config = await api('GET', '/sim/config');
    document.getElementById('sched-name').textContent = config.scheduler;
    document.getElementById('meta-rpm').textContent = `rpm ${config.rpm}`;
    document.getElementById('meta-tpm').textContent = `tpm ${config.tpm}`;

    // Create session
    const sess = await api('POST', '/sessions');
    MY_SESSION_ID = sess.session_id;
    MY_INT_ID = sess.int_id;
    document.getElementById('my-session-badge').textContent = `S${MY_INT_ID}`;
    document.getElementById('chat-session-tag').textContent = `S${MY_INT_ID}`;

    // Init phase bar
    renderPhaseBar(null);

    // Connect SSE streams
    connectGlobalSSE();
    connectSessionSSE();

    // Hide overlay
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('conn-dot').classList.add('connected');

    // Run the workflow
    runWorkflow(prompt);

  } catch (e) {
    btn.disabled = false;
    btn.textContent = 'Connect & run';
    alert('Connection failed: ' + e.message);
  }
}

// ================================================================
// API helper
// ================================================================
async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'Authorization': `Bearer ${API_KEY}`,
      'Content-Type': 'application/json',
    },
  };
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(BASE_URL + path, opts);
  if (!resp.ok) throw new Error(`${resp.status} ${resp.statusText}`);
  if (resp.status === 204) return null;
  return resp.json();
}

// ================================================================
// SSE connections
// ================================================================
function connectGlobalSSE() {
  const url = `${BASE_URL}/sim/events?token=${encodeURIComponent(API_KEY)}`;
  globalSSE = new EventSource(url);
  globalSSE.addEventListener('queue_snapshot', (e) => {
    const data = JSON.parse(e.data);
    renderQueueSnapshot(data);
  });
  globalSSE.addEventListener('call_enqueued', (e) => {
    // Stats updated via snapshot
  });
  globalSSE.addEventListener('call_completed', (e) => {
    const data = JSON.parse(e.data);
    completedCount++;
    latencies.push(data.latency_ms);
    document.getElementById('stat-done').textContent = completedCount;
    const avg = latencies.reduce((a,b) => a+b, 0) / latencies.length;
    document.getElementById('stat-lat').textContent = avg < 1000
      ? Math.round(avg) + 'ms'
      : (avg / 1000).toFixed(1) + 's';
  });
  globalSSE.addEventListener('rate_limited', (e) => {
    const data = JSON.parse(e.data);
    const banner = document.getElementById('rate-banner');
    banner.classList.add('visible');
    banner.textContent = `\u23F2 Rate limited (${data.reason.toUpperCase()}) — wait ${data.wait_seconds}s`;
    clearTimeout(banner._timer);
    banner._timer = setTimeout(() => banner.classList.remove('visible'), data.wait_seconds * 1000 + 500);
  });
  globalSSE.onerror = () => {
    document.getElementById('conn-dot').classList.remove('connected');
    document.getElementById('conn-dot').classList.add('error');
  };
}

function connectSessionSSE() {
  const url = `${BASE_URL}/sessions/${MY_SESSION_ID}/events?token=${encodeURIComponent(API_KEY)}`;
  sessionSSE = new EventSource(url);

  sessionSSE.addEventListener('batch_progress', (e) => {
    const data = JSON.parse(e.data);
    const key = data.latest;

    // Update analyst/reviewer card
    if (data.content) {
      analystResults[key] = data.content;
      analystStatus[key] = 'done';
    }

    // Update phase counts
    if (currentPhase === 'analysts') {
      phaseCounts.analysts = data.completed;
      renderPhaseBar('analysts');
    } else if (currentPhase === 'reviewers') {
      phaseCounts.reviewers = data.completed;
      renderPhaseBar('reviewers');
    }

    renderAnalystGrid();
  });

  sessionSSE.addEventListener('call_dispatched', (e) => {
    const data = JSON.parse(e.data);
    const key = data.call_key;
    if (analystStatus[key] === 'pending') {
      analystStatus[key] = 'active';
      renderAnalystGrid();
    }
  });
}

// ================================================================
// Workflow execution (mirrors client_example.py)
// ================================================================
async function runWorkflow(prompt) {
  const base = `/sessions/${MY_SESSION_ID}/completions`;
  const workflowStart = performance.now();

  // Show user prompt in chat
  appendChat('user', prompt);

  // Step 1: Plan
  setPhase('plan');
  appendStepLabel(1, 'orchestrator — plan');
  const planMsg = appendChat('sys', '');
  const planResp = await api('POST', base, {
    call_type: 'orchestrator',
    call_detail: 'plan',
    messages: [{ role: 'user', content: prompt }],
  });
  planMsg.textContent = planResp.content;
  markPhaseDone('plan');

  // Step 2: Analysts
  setPhase('analysts');
  appendStepLabel(2, `analysts — parallel research (0/${ANALYSTS.length})`);
  ANALYSTS.forEach(name => {
    analystStatus[name] = 'pending';
    analystResults[name] = null;
  });
  renderAnalystGrid();

  const analystCalls = ANALYSTS.map(name => ({
    call_type: name,
    messages: [{ role: 'user', content: prompt }],
  }));
  const analystResp = await api('POST', base + '/batch', { calls: analystCalls });
  // Batch is done — ensure all are marked done
  analystResp.completions.forEach((c, i) => {
    const name = ANALYSTS[i];
    analystResults[name] = c.content;
    analystStatus[name] = 'done';
  });
  phaseCounts.analysts = ANALYSTS.length;
  renderAnalystGrid();
  renderPhaseBar('analysts');
  markPhaseDone('analysts');

  // Step 3: Synthesize
  setPhase('synthesize');
  appendStepLabel(3, 'orchestrator — synthesize');
  const synthMsg = appendChat('sys', '');

  const analystText = ANALYSTS.map(name =>
    `--- ${name} ---\n${analystResults[name]}`
  ).join('\n\n');

  const synthResp = await api('POST', base, {
    call_type: 'orchestrator',
    call_detail: 'synthesize',
    messages: [
      { role: 'user', content: prompt },
      { role: 'assistant', content: planResp.content },
      { role: 'user', content: `Here are findings from ${ANALYSTS.length} specialist analysts:\n\n${analystText}\n\nWrite a comprehensive draft synthesis of these findings.` },
    ],
  });
  synthMsg.textContent = synthResp.content;
  markPhaseDone('synthesize');

  // Step 4: Reviewers
  setPhase('reviewers');
  appendStepLabel(4, `reviewers — parallel review (0/${REVIEWERS.length})`);
  REVIEWERS.forEach(name => {
    analystStatus[name] = 'pending';
    analystResults[name] = null;
  });
  renderReviewerGrid();

  const reviewCalls = REVIEWERS.map(name => ({
    call_type: name,
    messages: [{ role: 'user', content: synthResp.content }],
  }));
  const reviewResp = await api('POST', base + '/batch', { calls: reviewCalls });
  reviewResp.completions.forEach((c, i) => {
    const name = REVIEWERS[i];
    analystResults[name] = c.content;
    analystStatus[name] = 'done';
  });
  phaseCounts.reviewers = REVIEWERS.length;
  renderReviewerGrid();
  renderPhaseBar('reviewers');
  markPhaseDone('reviewers');

  // Step 5: Final
  setPhase('final');
  appendStepLabel(5, 'orchestrator — final synthesis');
  const finalMsg = appendChat('sys', '');

  const reviewerText = REVIEWERS.map(name =>
    `--- ${name} ---\n${analystResults[name]}`
  ).join('\n\n');

  const finalResp = await api('POST', base, {
    call_type: 'orchestrator',
    call_detail: 'final',
    messages: [
      { role: 'user', content: prompt },
      { role: 'assistant', content: planResp.content },
      { role: 'user', content: `Here are findings from ${ANALYSTS.length} specialist analysts:\n\n${analystText}\n\nWrite a comprehensive draft synthesis of these findings.` },
      { role: 'assistant', content: synthResp.content },
      { role: 'user', content: `Here is feedback from ${REVIEWERS.length} reviewers:\n\n${reviewerText}\n\nIncorporate the feedback and produce your final polished synthesis.` },
    ],
  });
  finalMsg.textContent = finalResp.content;
  markPhaseDone('final');
  currentPhase = null;  // All phases done

  // Show completion banner
  const elapsed = performance.now() - workflowStart;
  const totalCalls = 3 + ANALYSTS.length + REVIEWERS.length;
  showCompletionBanner(elapsed, totalCalls);

  // Cleanup
  await api('DELETE', `/sessions/${MY_SESSION_ID}`);
}

// ================================================================
// Completion banner
// ================================================================
function showCompletionBanner(elapsedMs, totalCalls) {
  const secs = (elapsedMs / 1000).toFixed(1);
  const avgLat = latencies.length > 0
    ? Math.round(latencies.reduce((a, b) => a + b, 0) / latencies.length)
    : 0;

  // Update phase bar to done state
  document.getElementById('phase-bar').classList.add('all-done');

  // Banner in chat panel
  const body = document.getElementById('chat-body');
  const banner = document.createElement('div');
  banner.className = 'completion-banner';
  banner.innerHTML = `
    <div class="completion-check">\u2713</div>
    <div class="completion-title">Workflow complete</div>
    <div class="completion-stats">
      <div class="completion-stat">
        <div class="completion-stat-val" style="color:var(--green)">${secs}s</div>
        <div class="completion-stat-label">Total time</div>
      </div>
      <div class="completion-stat">
        <div class="completion-stat-val" style="color:var(--accent-hi)">${totalCalls}</div>
        <div class="completion-stat-label">LLM calls</div>
      </div>
      <div class="completion-stat">
        <div class="completion-stat-val" style="color:var(--amber)">${avgLat}ms</div>
        <div class="completion-stat-label">Avg latency</div>
      </div>
    </div>
  `;
  body.appendChild(banner);
  banner.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

// ================================================================
// Queue rendering
// ================================================================
let prevPositions = {};  // itemKey -> position from last snapshot

function itemKey(item) {
  return `${item.session_id}:${item.call_key}:${item.enqueue_order}`;
}

function renderQueueSnapshot(data) {
  // Pending is already sorted by priority desc, enqueue_order asc from the scheduler
  const pending = data.pending || [];
  const inflight = data.in_flight || [];

  document.getElementById('stat-pending').textContent = pending.length;
  document.getElementById('stat-inflight').textContent = inflight.length;

  // Count unique sessions across pending + in-flight
  const sessionSet = new Set([
    ...pending.map(p => p.session_id),
    ...inflight.map(f => f.session_id),
  ]);
  document.getElementById('meta-sessions').textContent = sessionSet.size + ' sessions';

  // Build new position map for diffing
  const newPositions = {};
  pending.forEach((item, i) => {
    newPositions[itemKey(item)] = i;
  });

  // Pending list
  const pl = document.getElementById('pending-list');
  if (pending.length === 0) {
    pl.innerHTML = '<div class="empty-state">No pending calls</div>';
  } else {
    pl.innerHTML = pending.map((item, i) => {
      const isMine = item.session_id === MY_INT_ID;
      const key = itemKey(item);
      const prev = prevPositions[key];

      // Compute movement arrow
      let arrowHtml = '';
      if (prev === undefined) {
        arrowHtml = '<span class="q-arrow new-item">new</span>';
      } else if (prev !== i) {
        if (i < prev) {
          const delta = prev - i;
          arrowHtml = `<span class="q-arrow up">\u25B2${delta}</span>`;
        } else {
          const delta = i - prev;
          arrowHtml = `<span class="q-arrow down">\u25BC${delta}</span>`;
        }
      }

      const priColor = item.priority >= 0.9 ? 'var(--green)' :
                       item.priority >= 0.3 ? 'var(--amber)' : 'var(--red)';

      return `<div class="q-row${isMine ? ' mine' : ''}">
        <div class="q-pos">#${i + 1}${arrowHtml}</div>
        <div class="q-info">
          <span class="q-name">${escHtml(item.call_key)}</span>
          ${isMine ? '<span class="badge badge-you">you</span>' : ''}
        </div>
        <div class="q-sid${isMine ? ' mine-sid' : ''}">S${item.session_id}</div>
        <div class="q-pri" style="color:${priColor}">${item.priority.toFixed(2)}</div>
      </div>`;
    }).join('');
  }

  // Save positions for next diff
  prevPositions = newPositions;

  // In-flight list
  const fl = document.getElementById('inflight-list');
  if (inflight.length === 0) {
    fl.innerHTML = '<div class="empty-state">Nothing dispatched</div>';
  } else {
    const now = Date.now() / 1000;
    fl.innerHTML = inflight.map(item => {
      const isMine = item.session_id === MY_INT_ID;
      const elapsed = item.dispatched_at ? ((now - item.dispatched_at) * 1000) : 0;
      const elStr = elapsed < 1000 ? Math.round(elapsed) + 'ms' : (elapsed / 1000).toFixed(1) + 's';
      return `<div class="if-row${isMine ? ' mine' : ''}">
        <div class="q-info">
          <span class="q-name">${escHtml(item.call_key)}</span>
          ${isMine ? '<span class="badge badge-you">you</span>' : ''}
          <span class="q-session">S${item.session_id}</span>
        </div>
        <div class="if-elapsed">${elStr}</div>
        <div class="bar-track"><div class="bar-fill"></div></div>
      </div>`;
    }).join('');
  }

  // Update analyst/reviewer card queue positions from pending data
  if (currentPhase === 'analysts' || currentPhase === 'reviewers') {
    const names = currentPhase === 'analysts' ? ANALYSTS : REVIEWERS;
    names.forEach(name => {
      if (analystStatus[name] === 'pending') {
        const inFlight = inflight.find(f => f.session_id === MY_INT_ID && f.call_key === name);
        if (inFlight) {
          analystStatus[name] = 'active';
        }
        const inPending = pending.find(p => p.session_id === MY_INT_ID && p.call_key === name);
        const el = document.getElementById('ac-status-' + name.replace(/[^a-z0-9]/g, '_'));
        if (el && inPending) {
          el.textContent = `#${inPending.position + 1} in queue`;
        }
      }
    });
    if (currentPhase === 'analysts') renderAnalystGrid();
    else renderReviewerGrid();
  }
}

// ================================================================
// Phase bar
// ================================================================
function renderPhaseBar(activePhase) {
  const bar = document.getElementById('phase-bar');
  bar.innerHTML = PHASES.map((p, i) => {
    const idx = PHASES.indexOf(currentPhase);
    const pIdx = i;
    let dotClass = '';
    let nameClass = '';
    let countHtml = '';

    if (pIdx < idx || (pIdx === idx && currentPhase !== p)) {
      dotClass = 'done'; nameClass = 'done';
    } else if (p === currentPhase) {
      dotClass = 'active'; nameClass = 'active';
    }

    // Check if phase is fully done
    const phaseEl = document.querySelector(`.phase-dot[data-phase="${p}"]`);
    if (PHASE_TOTALS[p]) {
      const count = phaseCounts[p] || 0;
      const total = PHASE_TOTALS[p];
      const isActive = p === currentPhase;
      countHtml = `<span class="phase-count${isActive ? ' active' : ''}">${count}/${total}</span>`;
    }

    const sep = i < PHASES.length - 1 ? '<div class="phase-sep"></div>' : '';
    return `<div class="phase-step">
      <div class="phase-dot ${dotClass}" data-phase="${p}"></div>
      <span class="phase-name ${nameClass}">${PHASE_LABELS[i]}</span>
      ${countHtml}
    </div>${sep}`;
  }).join('');
}

function setPhase(phase) {
  currentPhase = phase;
  renderPhaseBar(phase);
}

function markPhaseDone(phase) {
  // Mark the dot as done
  const dot = document.querySelector(`.phase-dot[data-phase="${phase}"]`);
  if (dot) {
    dot.classList.remove('active');
    dot.classList.add('done');
  }
  const name = dot?.parentElement?.querySelector('.phase-name');
  if (name) {
    name.classList.remove('active');
    name.classList.add('done');
  }
}

// ================================================================
// Chat panel rendering
// ================================================================
function appendChat(type, text) {
  const body = document.getElementById('chat-body');
  const div = document.createElement('div');
  div.className = type === 'user' ? 'msg msg-user' : 'msg msg-sys';
  div.textContent = text;
  if (type === 'sys' && !text) {
    div.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
  }
  body.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return div;
}

function appendStepLabel(num, text) {
  const body = document.getElementById('chat-body');
  const div = document.createElement('div');
  div.className = 'step-label';
  div.innerHTML = `<span class="step-num">step ${num}</span> ${escHtml(text)}`;
  body.appendChild(div);
}

// ================================================================
// Analyst / Reviewer grids
// ================================================================
let analystGridEl = null;
let reviewerGridEl = null;

function renderAnalystGrid() {
  if (!analystGridEl) {
    analystGridEl = document.createElement('div');
    analystGridEl.className = 'analyst-grid';
    document.getElementById('chat-body').appendChild(analystGridEl);
  }
  analystGridEl.innerHTML = ANALYSTS.map(name => {
    const status = analystStatus[name] || 'pending';
    const content = analystResults[name];
    const shortName = name.replace('analyst_', '');
    const safeId = name.replace(/[^a-z0-9]/g, '_');

    let statusHtml = '';
    let bodyHtml = '';

    if (status === 'done') {
      statusHtml = `<span class="ac-status done">&#10003;</span>`;
      bodyHtml = `<div class="ac-body has-content">${escHtml(content || '')}</div>`;
    } else if (status === 'active') {
      statusHtml = `<span class="ac-status active" id="ac-status-${safeId}">streaming</span>`;
      bodyHtml = `<div class="ac-body"><span class="typing"><i></i><i></i><i></i></span></div>`;
    } else {
      statusHtml = `<span class="ac-status pending" id="ac-status-${safeId}">pending</span>`;
      bodyHtml = `<div class="ac-body" style="font-style:italic;font-size:10px;color:var(--tx3)">Waiting</div>`;
    }

    return `<div class="ac ${status}">
      <div class="ac-top"><div class="ac-name">${escHtml(shortName)}</div>${statusHtml}</div>
      ${bodyHtml}
    </div>`;
  }).join('');
}

function renderReviewerGrid() {
  if (!reviewerGridEl) {
    reviewerGridEl = document.createElement('div');
    reviewerGridEl.className = 'analyst-grid';
    document.getElementById('chat-body').appendChild(reviewerGridEl);
  }
  reviewerGridEl.innerHTML = REVIEWERS.map(name => {
    const status = analystStatus[name] || 'pending';
    const content = analystResults[name];
    const shortName = name.replace('review_', '');
    const safeId = name.replace(/[^a-z0-9]/g, '_');

    let statusHtml = '';
    let bodyHtml = '';

    if (status === 'done') {
      statusHtml = `<span class="ac-status done">&#10003;</span>`;
      bodyHtml = `<div class="ac-body has-content">${escHtml(content || '')}</div>`;
    } else if (status === 'active') {
      statusHtml = `<span class="ac-status active" id="ac-status-${safeId}">streaming</span>`;
      bodyHtml = `<div class="ac-body"><span class="typing"><i></i><i></i><i></i></span></div>`;
    } else {
      statusHtml = `<span class="ac-status pending" id="ac-status-${safeId}">pending</span>`;
      bodyHtml = `<div class="ac-body" style="font-style:italic;font-size:10px;color:var(--tx3)">Waiting</div>`;
    }

    return `<div class="ac ${status}">
      <div class="ac-top"><div class="ac-name">${escHtml(shortName)}</div>${statusHtml}</div>
      ${bodyHtml}
    </div>`;
  }).join('');
}

// ================================================================
// Util
// ================================================================
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
